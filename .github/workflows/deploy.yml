name: Deploy

# main -> staging automatically. Production: publish a GitHub release, or run this
# workflow manually and choose "production". Protect the "production" GitHub
# Environment with required reviewers so production deploys need an approval.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'release' && 'production' || inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to ${{ github.event_name == 'release' && 'production' || inputs.environment || 'staging' }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.event_name == 'release' && 'production' || inputs.environment || 'staging' }}
      url: ${{ vars.APP_URL }}
    env:
      TARGET: ${{ github.event_name == 'release' && 'production' || inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_URL: ${{ vars.APP_URL }}
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Check GitHub Environment configuration
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}
          IDENTITY_ENCRYPTION_KEY: ${{ secrets.IDENTITY_ENCRYPTION_KEY }}
          IDENTITY_HASH_KEY: ${{ secrets.IDENTITY_HASH_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APP_URL MONGO_URI SESSION_SECRET \
                      OTP_SECRET IDENTITY_ENCRYPTION_KEY IDENTITY_HASH_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Set these in the '$TARGET' GitHub Environment (see docs/DEPLOYMENT.md): ${missing[*]}"
            exit 1
          fi
          for name in SMTP_USER SMTP_PASS SMTP_FROM; do
            [ -n "${!name}" ] || echo "::warning::$name is not set; verification emails will fail until it is."
          done

      # API first: the web Worker's service binding must point at an existing Worker.
      - name: Install API dependencies
        working-directory: server
        run: npm ci
      - name: Deploy API Worker with its secrets
        working-directory: server
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}
          RENTAL_OTP_SECRET: ${{ secrets.RENTAL_OTP_SECRET }}
          IDENTITY_ENCRYPTION_KEY: ${{ secrets.IDENTITY_ENCRYPTION_KEY }}
          IDENTITY_HASH_KEY: ${{ secrets.IDENTITY_HASH_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
        run: |
          secrets_file="$RUNNER_TEMP/api-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          # Only non-empty values are uploaded; secrets already on the Worker are kept.
          jq -n 'env | with_entries(select(.key | IN(
              "MONGO_URI", "SESSION_SECRET", "OTP_SECRET", "RENTAL_OTP_SECRET",
              "IDENTITY_ENCRYPTION_KEY", "IDENTITY_HASH_KEY", "SMTP_USER", "SMTP_PASS",
              "SMTP_FROM", "ADMIN_EMAIL", "GOOGLE_CLIENT_ID", "GEOAPIFY_API_KEY", "TWILIO_ACCOUNT_SID",
              "TWILIO_AUTH_TOKEN", "TWILIO_FROM_NUMBER")) | select(.value != ""))' > "$secrets_file"
          npx wrangler deploy --env "$TARGET" --secrets-file "$secrets_file"

      - name: Build web app
        working-directory: client
        env:
          VITE_GEOAPIFY_API_KEY: ${{ secrets.VITE_GEOAPIFY_API_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}
        run: |
          npm ci
          npm run build
      - name: Deploy web Worker
        working-directory: client
        run: npx wrangler deploy --env "$TARGET"

      - name: Smoke test the deployment
        run: |
          base="${APP_URL%/}"
          page="$(curl -fsS "$base/")" || true
          grep -q '<div id="root">' <<< "$page" || { echo "::error::$base/ did not serve the web app"; exit 1; }
          # The first request starts the API Durable Object and connects to Atlas.
          for attempt in $(seq 1 20); do
            health="$(curl -fsS "$base/api/health" 2>/dev/null)" || true
            if grep -q '"database":"connected"' <<< "$health"; then
              echo "API healthy at $base/api/health"
              exit 0
            fi
            sleep 6
          done
          echo "::error::$base/api/health never reported a connected database. Check MONGO_URI and the Atlas IP access list."
          exit 1
